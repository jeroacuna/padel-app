<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Acceso administración · Padel Arena</title>
<link rel="icon" type="image/svg+xml" href="/assets/icons/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,800&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body class="login-body">
<main class="login-card glass">
  <img src="/assets/icons/logo.svg" alt="" width="56" height="56">
  <h1>Panel de administración</h1>
  <p class="sub">Ingresá con tu cuenta de administrador</p>
  <form id="formLogin" novalidate>
    <label class="campo">Email<input name="email" type="email" required autocomplete="username"></label>
    <label class="campo">Contraseña
      <span class="pass"><input name="password" id="password" type="password" required autocomplete="current-password"><button type="button" id="verPass" aria-label="Mostrar contraseña">Ver</button></span>
    </label>
    <p id="msg" role="alert"></p>
    <button class="btn" type="submit">Ingresar</button>
  </form>
  <a class="volver" href="/index.html">← Volver a la web</a>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/config.js"></script>
<script src="/js/supabase.js"></script>
<script type="module" src="/admin/js/login.js"></script>
</body>
</html>
