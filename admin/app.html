<!DOCTYPE html>
<html lang="es">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Panel · Padel Arena</title>
<link rel="icon" type="image/svg+xml" href="../assets/icons/logo.svg">

    <main class="main" id="contenido"></main>

</div>
