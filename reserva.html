<style>
  .mi-reserva { max-width: 560px; margin: 0 auto; }
  .mi-reserva .caja { padding: 1.6rem; }
  .mi-reserva p.sub { color: var(--muted); margin-bottom: 1.2rem; }
  .mi-reserva .msg { min-height: 1.4rem; margin: .2rem 0 .6rem; font-size: .92rem; }
  .mi-reserva .msg.error { color: #fca5a5; }
  .mi-reserva .estado { display: inline-block; padding: .15rem .8rem; border-radius: 99px; font-size: .8rem; font-weight: 800; background: rgba(37,99,255,.45); }
  .mi-reserva .estado.cancelada { background: rgba(239,68,68,.3); color: #fca5a5; }
  .mi-reserva .estado.pendiente { background: #f59e0b; color: var(--navy); }
  .mi-reserva .estado.completada { background: rgba(198,244,50,.2); color: var(--lime); }
  .mi-reserva .aviso { padding: 1rem; border-radius: .9rem; border: 1px solid var(--line); background: var(--glass); color: var(--muted); margin: 1rem 0; }
  .mi-reserva .confirmar { margin-top: 1rem; padding: 1rem; border-radius: .9rem; border: 1px solid rgba(239,68,68,.5); background: rgba(239,68,68,.1); }
  .mi-reserva .confirmar .fila { display: flex; gap: .6rem; flex-wrap: wrap; margin-top: .8rem; }
  .btn-rojo { background: #ef4444; color: #fff; }
  .mi-reserva .ok-grande { text-align: center; padding: 1rem 0; }
</style>
